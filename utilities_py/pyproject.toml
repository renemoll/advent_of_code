[project]
name = "utilities-py"
version = "0.1.0"
description = "Advent of Code Utilities in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--cov=utilities_py"

[tool.coverage.run]
branch = true
omit = [
    "runner.py"
]
